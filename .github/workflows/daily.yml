name: LinkedIn Daily Games

on:
  # 05:00 IST (23:30 UTC).
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream linkedin-puzzles git ref (tag/branch/commit)'
        required: false
        default: 'main'

permissions:
  contents: read
  actions: read

concurrency:
  group: linkedin-daily
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/nqrwhal/linkedin-puzzles.git
  UPSTREAM_REF: ${{ github.event.inputs.ref || 'main' }}
  DATA_DIR: upstream/service/data
  PROFILE_ARTIFACT: linkedin-profile

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v4

      - name: Clone upstream solver
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_REPO" upstream
          mkdir -p "$DATA_DIR/profile"

      - name: Restore previous signed-in profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf restore-profile
          mkdir -p restore-profile

          last_run="$(gh run list \
            --workflow daily.yml \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId' | head -n 1 || true)"

          restored='false'
          if [[ -n "$last_run" ]] && gh run download "$last_run" \
              --name "$PROFILE_ARTIFACT" \
              --dir restore-profile; then
            echo "Restored profile from successful run $last_run"
            cp -a restore-profile/. "$DATA_DIR/profile/"
            restored='true'
          fi

          if [[ "$restored" != 'true' ]]; then
            if [[ -z "${{ secrets.LINKEDIN_STORAGE_STATE_B64 }}" ]]; then
              echo 'ERROR: GitHub Secret LINKEDIN_STORAGE_STATE_B64 is not configured.' >&2
              exit 1
            fi

            printf '%s' "${{ secrets.LINKEDIN_STORAGE_STATE_B64 }}" | base64 --decode > linkedin-storage-state.json
            chmod 600 linkedin-storage-state.json

            echo 'Seeding the Chromium profile from LINKEDIN_STORAGE_STATE_B64.'
            npm ci --prefix upstream/service --omit=dev
            npx --prefix upstream/service playwright install chromium
            node scripts/seed-profile-from-storage-state.cjs
            rm -f linkedin-storage-state.json
          fi

          # The upstream solver container runs as UID/GID 1000. GitHub's runner
          # owns files created above, so hand the mounted browser profile to the
          # container user before Docker starts.
          sudo chown -R 1000:1000 "$DATA_DIR/profile"
          sudo chmod -R u+rwX,go-rwx "$DATA_DIR/profile"

      - name: Build upstream headless solver
        working-directory: upstream/service
        run: docker compose build solver

      - name: Solve all LinkedIn games
        working-directory: upstream/service
        env:
          CI: 'true'
        run: ./puzzles run

      - name: Persist updated signed-in browser profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-profile
          path: upstream/service/data/profile/
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-run-${{ github.run_number }}
          path: |
            upstream/service/data/latest.json
            upstream/service/data/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
