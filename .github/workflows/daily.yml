name: LinkedIn Daily Games

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream linkedin-puzzles git ref (tag/branch/commit)'
        required: false
        default: 'main'

permissions:
  contents: read
  actions: read

env:
  UPSTREAM_REPO: https://github.com/nqrwhal/linkedin-puzzles.git
  UPSTREAM_REF: ${{ github.event.inputs.ref || 'main' }}
  DATA_DIR: upstream/service/data
  PROFILE_ARTIFACT: linkedin-profile

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v4

      - name: Clone upstream extension
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_REPO" upstream
          mkdir -p "$DATA_DIR/profile" "$DATA_DIR/home" "$DATA_DIR/browser-run"

      - name: Restore or seed signed-in browser profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf restore-profile
          mkdir -p restore-profile

          last_run="$(gh run list \
            --workflow daily.yml \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId' | head -n 1 || true)"

          restored='false'
          if [[ -n "$last_run" ]] && gh run download "$last_run" \
              --name "$PROFILE_ARTIFACT" \
              --dir restore-profile; then
            echo "Restored profile from successful run $last_run"
            cp -a restore-profile/. "$DATA_DIR/profile/"
            restored='true'
          fi

          if [[ "$restored" != 'true' ]]; then
            if [[ -z "${{ secrets.LINKEDIN_STORAGE_STATE_B64 }}" ]]; then
              echo 'ERROR: GitHub Secret LINKEDIN_STORAGE_STATE_B64 is not configured.' >&2
              exit 1
            fi

            printf '%s' "${{ secrets.LINKEDIN_STORAGE_STATE_B64 }}" | base64 --decode > linkedin-storage-state.json
            chmod 600 linkedin-storage-state.json

            echo 'Seeding Chromium profile from LINKEDIN_STORAGE_STATE_B64.'
            npm ci --prefix upstream/service --omit=dev
            npx --prefix upstream/service playwright install chromium
            node scripts/seed-profile-from-storage-state.cjs
            test -n "$(find "$DATA_DIR/profile" -mindepth 1 -print -quit)"
            rm -f linkedin-storage-state.json
          else
            npm ci --prefix upstream/service --omit=dev
          fi

      - name: Run real browser with upstream extension
        shell: bash
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR/browser-run"
          Xvfb :99 -screen 0 1360x900x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for n in {1..50}; do [[ -S /tmp/.X11-unix/X99 ]] && break; sleep .1; done
          node scripts/browser-solve.cjs

      - name: Persist updated signed-in browser profile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-profile
          path: upstream/service/data/profile/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload browser run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-browser-run-${{ github.run_number }}
          path: upstream/service/data/browser-run/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
