name: LinkedIn Daily Games

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream linkedin-puzzles git ref (tag/branch/commit)'
        required: false
        default: 'main'

permissions:
  contents: read
  actions: read

env:
  UPSTREAM_REPO: https://github.com/nqrwhal/linkedin-puzzles.git
  UPSTREAM_REF: ${{ github.event.inputs.ref || 'main' }}
  DATA_DIR: upstream/service/data
  PROFILE_ARTIFACT: linkedin-profile

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v4

      - name: Clone upstream solver
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_REF" "$UPSTREAM_REPO" upstream
          mkdir -p "$DATA_DIR/profile"
          mkdir -p "$DATA_DIR/home"

      - name: Restore previous signed-in profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf restore-profile
          mkdir -p restore-profile

          last_run="$(gh run list \
            --workflow daily.yml \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[].databaseId' | head -n 1 || true)"

          restored='false'
          if [[ -n "$last_run" ]] && gh run download "$last_run" \
              --name "$PROFILE_ARTIFACT" \
              --dir restore-profile; then
            echo "Restored profile from successful run $last_run"
            cp -a restore-profile/. "$DATA_DIR/profile/"
            restored='true'
          fi

          if [[ "$restored" != 'true' ]]; then
            if [[ -z "${{ secrets.LINKEDIN_STORAGE_STATE_B64 }}" ]]; then
              echo 'ERROR: GitHub Secret LINKEDIN_STORAGE_STATE_B64 is not configured.' >&2
              exit 1
            fi

            printf '%s' "${{ secrets.LINKEDIN_STORAGE_STATE_B64 }}" | base64 --decode > linkedin-storage-state.json
            chmod 600 linkedin-storage-state.json

            echo 'Seeding the Chromium profile from LINKEDIN_STORAGE_STATE_B64.'
            npm ci --prefix upstream/service --omit=dev
            npx --prefix upstream/service playwright install chromium
            node scripts/seed-profile-from-storage-state.cjs
            test -n "$(find "$DATA_DIR/profile" -mindepth 1 -print -quit)"
            rm -f linkedin-storage-state.json
          fi

          sudo chown -R 1000:1000 "$DATA_DIR"
          sudo chmod -R u+rwX,go-rwx "$DATA_DIR"

      - name: Build upstream headless solver
        working-directory: upstream/service
        run: docker compose build solver

      - name: Diagnose LinkedIn authentication
        working-directory: upstream/service
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm -T solver node - <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const context = await chromium.launchPersistentContext('/data/profile', {
              headless: true,
              viewport: { width: 1360, height: 800 },
              locale: 'en-US',
              timezoneId: 'America/Los_Angeles',
            });

            const cookies = await context.cookies('https://www.linkedin.com');
            const authCookies = cookies.filter(c => ['li_at', 'JSESSIONID'].includes(c.name));
            console.log(`AUTH_COOKIE_PRESENT li_at=${authCookies.some(c => c.name === 'li_at')} JSESSIONID=${authCookies.some(c => c.name === 'JSESSIONID')}`);

            const page = await context.newPage();
            page.on('response', response => {
              const url = response.url();
              if (url.includes('linkedin.com') && [200, 301, 302, 303, 307, 308].includes(response.status())) {
                console.log(`LINKEDIN_RESPONSE status=${response.status()} url=${new URL(url).pathname}`);
              }
            });

            try {
              await page.goto('https://www.linkedin.com/feed/', { waitUntil: 'domcontentloaded', timeout: 45000 });
              console.log(`AUTH_CHECK final_url=${new URL(page.url()).pathname} title=${JSON.stringify(await page.title())}`);
              const signedIn = await page.locator('input[name="session_key"]').count() === 0 &&
                !/\/login|\/checkpoint|\/uas\/login/i.test(page.url());
              console.log(`AUTH_CHECK signed_in=${signedIn}`);
            } catch (error) {
              console.log(`AUTH_CHECK navigation_error=${JSON.stringify(String(error.message).slice(0, 300))}`);
            } finally {
              await page.close();
              await context.close();
            }
          })().catch(error => {
            console.error(`AUTH_CHECK fatal=${JSON.stringify(String(error.message).slice(0, 300))}`);
            process.exit(1);
          });
          NODE

      - name: Solve all LinkedIn games
        working-directory: upstream/service
        env:
          CI: 'true'
        run: ./puzzles run

      - name: Normalize generated file permissions
        if: always()
        shell: bash
        run: |
          sudo chown -R 1000:1000 "$DATA_DIR" || true
          sudo chmod -R u+rwX,go-rwx "$DATA_DIR" || true

      - name: Persist updated signed-in browser profile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-profile
          path: upstream/service/data/profile/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-run-${{ github.run_number }}
          path: |
            upstream/service/data/latest.json
            upstream/service/data/runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
