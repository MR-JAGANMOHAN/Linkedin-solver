name: LinkedIn Games Solver

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install chromium

      - run: node run.js
